catalog:
  # The kit package tier, as a content-hashed tarball on public R2 — the family's one pin form, and
  # rati was the last consumer still on the `nazar-ch/jnana-kit#workspace=@jnana-app/kit` git
  # spelling (kit◊KC-13). That spelling resolved whatever the kit's default branch happened to
  # be at install time, so the gate's own code could move without a line of this repo moving; the
  # URL's key hashes what the archive CONTAINS rather than the archive's own bytes (kit◊KC-69), so
  # one content is one object however it was packed, it resolves the same bytes everywhere and
  # forever, and it needs no credential.
  #
  # Bump it from the `url` of the FIRST release in $JNANA_KIT_HOME/packages/manifest.json, which
  # lists them newest first:
  #
  #   node -e "console.log(require('$JNANA_KIT_HOME/packages/manifest.json').packages['@jnana-app/kit'][0].url)"
  #
  # `check-kit-package` (a battery step) reds on a pin that manifest does not list.
  #
  # The `approvedGitRepositories: ["**"]` entry that used to head this file went with the git pin:
  # the kit was the repo's ONE git-sourced dependency, and a wildcard approving every git host for
  # a repo that has none is an open door with nothing behind it.
  '@jnana-app/kit': 'https://app-updates.r2.jnana.app/packages/jnana-app-kit-0.0.0-98ddc13c3bffd29465592677a030c75d.tgz'
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vite-plus: 0.2.7
  vitest: 4.1.10

compressionLevel: mixed

enableGlobalCache: false

enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 0

npmPreapprovedPackages:
  - vitest
  - "@vitest/*"
